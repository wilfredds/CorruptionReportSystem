<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AutoCare">
  <!--
    Tab icon: a car silhouette on the brand orange, with the navy partner
    colour underneath. Kept as flat shapes with no text, because at 16px a
    letter turns to mush while a car shape is still readable.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8710a"/>
      <stop offset="100%" stop-color="#c45508"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- body -->
  <path fill="#ffffff"
        d="M12 38.5c0-1.2.5-2.3 1.4-3l2.3-1.9 3.2-7.4A5.5 5.5 0 0 1 24 23h16a5.5 5.5 0 0 1 5.1 3.2l3.2 7.4 2.3 1.9c.9.7 1.4 1.8 1.4 3v4.1c0 .9-.7 1.6-1.6 1.6h-2.6V42a1 1 0 0 0-1-1H15.2a1 1 0 0 0-1 1v2.2h-2.6c-.9 0-1.6-.7-1.6-1.6z"/>
  <!-- windscreen -->
  <path fill="#1b2a49"
        d="M24.6 27h14.8a2 2 0 0 1 1.8 1.2l2 4.6a.8.8 0 0 1-.7 1.1H21.5a.8.8 0 0 1-.7-1.1l2-4.6a2 2 0 0 1 1.8-1.2z"/>
  <!-- wheels -->
  <circle cx="20.5" cy="43.5" r="4.5" fill="#1b2a49"/>
  <circle cx="43.5" cy="43.5" r="4.5" fill="#1b2a49"/>
  <circle cx="20.5" cy="43.5" r="1.7" fill="#ffffff"/>
  <circle cx="43.5" cy="43.5" r="1.7" fill="#ffffff"/>
</svg>
